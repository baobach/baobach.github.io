name: "Weekly link check"
on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: link-check

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: "production"

      # Skipped: sites that block bots (LinkedIn 999, X and ACM 403), font
      # preconnect hints, and the analytics script
      - name: Check external links
        id: proofer
        continue-on-error: true
        run: |
          set -o pipefail
          bundle exec htmlproofer _site \
            \-\-ignore-status-codes "429,999" \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/linkedin\.com/,/\/\/(www\.)?x\.com/,/twitter\.com/,/fonts\.googleapis\.com/,/fonts\.gstatic\.com/,/googletagmanager\.com/,/dl\.acm\.org/" \
            2>&1 | tee proofer.log

      - name: Open or update the link-check issue
        if: steps.proofer.outcome == 'failure'
        run: |
          {
            echo "The weekly external link check failed on $(date -u +%F)."
            echo
            echo '```'
            grep -E "^\* |^  \* |^For the " proofer.log | head -n 150
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          gh label create "$LABEL" --color d73a4a --description "Broken external links" --force
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "Broken external links" --label "$LABEL" --body-file body.md
          fi

      - name: Close the link-check issue when links are fine again
        if: steps.proofer.outcome == 'success'
        run: |
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "External links pass again ($(date -u +%F))."
          fi
